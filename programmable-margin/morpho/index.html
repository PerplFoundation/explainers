<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programmable margin explainer</title>
<style>
body{margin:0;background:#e9ebf2;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;color:#1a1a1a}
#wrap{max-width:1600px;margin:0 auto;padding:12px 16px}
#stage{width:100%;aspect-ratio:16/9;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.08);border-radius:8px;overflow:hidden}
#stage svg{width:100%;height:100%;display:block}
.bar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin-top:12px;font-size:14px}
.bar b{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#5B5BF6}
button,select{font:inherit;padding:5px 10px;border:1px solid #c9ccd6;border-radius:5px;background:#fff;cursor:pointer}
button.on{background:#5B5BF6;color:#fff;border-color:#5B5BF6}
#scrub{flex:1;min-width:220px}
#explore{background:#fff;border-radius:8px;padding:10px 14px}
#explore label{display:flex;gap:8px;align-items:center}
.hint{color:#6b7280;font-size:12px}
#stagewrap{position:relative}
#ovbar{position:absolute;right:14px;top:calc(94% - 24px);display:flex;gap:10px}
.ov{border:none;border-radius:28px;background:rgba(255,255,255,.14);color:#fff;font-size:20px;
 font-weight:700;padding:12px 18px;cursor:pointer;transition:background .2s}
.ov:hover{background:rgba(255,255,255,.3)}
#ovNext.pulse{background:#5B5BF6;color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(91,91,246,.5)}50%{box-shadow:0 0 0 12px rgba(91,91,246,0)}}
body.record #ovbar{display:none}
body.record #wrap{padding:0;max-width:none}
body.record .bar{display:none}
body.record #stage{width:1600px;height:900px;border-radius:0;box-shadow:none}
</style></head>
<body>
<div id="wrap">
 <div id="stagewrap"><div id="stage"></div>
  <div id="ovbar"><button id="ovPrev" class="ov" title="Back (←)">‹</button>
  <button id="ovNext" class="ov" title="Next (→)">Next ›</button></div></div>
 <div class="bar">
  <label style="display:none">Story <select id="cut">
   <option value="lending">For a lending protocol</option>
   </select></label>
  <button id="back">‹ Back</button><button id="play">Pause</button><button id="next">Next ›</button>
  <label><input type="checkbox" id="auto"> Autoplay</label>
  <span id="scenes"></span>
  <input id="scrub" type="range" min="0" max="1000" value="0" title="Scrub within this scene">
 </div>
 <div class="bar" id="explore">
  <b>Try it</b>
  <label>MON price <input id="xp" type="range" min="-40" max="45" value="0"><span id="xpv">0%</span></label>
  <label>Funding to shorts <input id="xf" type="range" min="-10" max="20" step="0.5"><span id="xfv"></span></label>
  <label>Margin from <select id="xm"><option value="cf">Credit facility (in design)</option>
   <option value="own">Own capital (live)</option></select></label>
  <span class="hint">Moving a control pauses the story and shows the vault at those settings.</span>
 </div>
</div>
<script>
const F = {"source": "today's reads, block 121,879,867; illustrative", "read_block": 121879867, "read_utc": "2026-11-13 11:56", "read_date": "2026-11-13", "deposit_usd": 50000, "loop_leverage": 5, "ltv": 0.8, "lltv": 0.915, "short_leverage": 1.5, "short_label": "1.5x", "short_per_equity": 1.0, "margin_per_equity": 0.6666666666666666, "stake_pct": 11.713464747405299, "borrow_pct": 7.436315666221753, "funding90_pct": 10.970277777777776, "funding30_pct": 17.118499999999997, "credit_facility_pct": 8.0, "mmf": 0.05, "borrow_source": "Euler eWMON-6", "swap_pct_per_unit": 0.2524833839840368, "taker_pct": 0.0345, "legs_pct": {"stake": 11.713464747405299, "loop": 17.108596324734183, "funding": 10.970277777777776, "costs": -1.0789335359361472, "credit_facility": -5.333333333333333}, "net_credit_facility_pct": 33.38007198064778, "net_own_margin_pct": 23.22804318838867, "net_zero_funding_pct": 22.409794202870003, "loop_max_without_cf": 1.330376940133038, "rally_to_liquidation": 0.5873015873015872, "rally_to_topup": 0.4492753623188406, "gap_topup_to_liq": 0.09523809523809512, "liq_after_one_topup": 1.3004370830457788, "worst72_rise_pct": 38.358570275786775, "worst1h_pct": 6.239946380697048, "years_to_lltv": {"5": 2.686246752151881, "10": 1.3431233760759405, "20": 0.6715616880379702}, "es_bands": {"open": 2.0, "restricted": 1.25}, "ausd_supply_morpho_pct": 5.270069420398848, "ausd_supply_morpho_usd": 21536266.491456013, "spec": {"source": "credit facility spec, rates read 2026-10-14; illustrative", "read_block": 113308949, "deposit_usd": 50000, "loop_leverage": 3, "ltv": 0.6666666666666666, "lltv": 0.915, "short_leverage": 2.0, "short_per_equity": 1.0, "margin_per_equity": 0.5, "stake_pct": 12.023729180150362, "borrow_pct": 8.335040892019657, "funding90_pct": 8.224666666666666, "funding30_pct": 8.772166666666665, "credit_facility_pct": 8.0, "mmf": 0.05, "legs_pct": {"stake": 12.023729180150362, "loop": 7.377376576261408, "funding": 8.224666666666666, "costs": -0.5739667679680736, "credit_facility": -4.0}, "net_credit_facility_pct": 23.051805655110364, "net_own_margin_pct": 18.034537103406908, "net_zero_funding_pct": 14.827138988443695, "loop_max_without_cf": 1.7094017094017095, "rally_to_liquidation": 0.42857142857142855, "rally_to_topup": 0.30434782608695654, "gap_topup_to_liq": 0.09523809523809534, "liq_after_one_topup": 0.8633540372670807, "worst72_rise_pct": 38.358570275786775, "worst72_start": "2026-08-18 22:00:00", "years_to_lltv": {"5": 6.3326778880309735, "10": 3.1663389440154868, "20": 1.5831694720077434}, "es_bands": {"open": 2.0, "restricted": 1.25}, "ausd_supply_morpho_pct": 6.418277056344544, "ausd_supply_morpho_usd": 18739898.371432}};
const D = F.deposit_usd;
const C = {ink:'#1a1a1a', mute:'#6b7280', line:'#c9ccd6', indigo:'#5B5BF6', indigoT:'#EEEEFE', indigoD:'#3434C8',
  green:'#2E7D32', greenT:'#EAF4EA', lime:'#4d7c0f', limeT:'#F0F6E4', amber:'#B07800', amberT:'#FBF3DF',
  red:'#B94A3E', redT:'#F9EAE8', teal:'#0E7490', tealT:'#E3F2F5', grey:'#9aa0a6'};

// ------------------------------------------------------------------ helpers
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const win = (u, a, len) => ease((u - a) / len);
const lerp = (a, b, f) => a + (b - a) * f;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const usd = v => (v < -0.5 ? '−' : '') + '$' + Math.round(Math.abs(v)).toLocaleString('en-US');
const sgnusd = v => (v > 0.5 ? '+' : '') + usd(v);
const pct = (v, d = 1) => (v < -0.00001 ? '−' : '') + Math.abs(v).toFixed(d) + '%';
const spct = (v, d = 1) => (v > 0.00001 ? '+' : '') + pct(v, d);

function T(x, y, s, o = {}) {
  return `<text x="${x}" y="${y}" font-size="${o.size || 20}" font-weight="${o.w || 400}" fill="${o.col || C.ink}" ` +
    `text-anchor="${o.anchor || 'start'}" opacity="${o.op ?? 1}"${o.mono ? ' font-family="Menlo,monospace"' : ''}>${esc(s)}</text>`;
}
function R(x, y, w, h, o = {}) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx ?? 8}" fill="${o.fill || '#fff'}" ` +
    `stroke="${o.stroke || 'none'}" stroke-width="${o.sw || 2}"${o.dash ? ' stroke-dasharray="9,6"' : ''} opacity="${o.op ?? 1}"/>`;
}
function arrow(pts, o = {}) {
  const col = o.col || C.ink, op = o.op ?? 1, w = o.w || 2.4;
  const [x1, y1] = pts[pts.length - 2], [x2, y2] = pts[pts.length - 1];
  const L = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  const bx = x2 - ux * 13, by = y2 - uy * 13, px = -uy * 6, py = ux * 6;
  const line = pts.slice(0, -1).concat([[bx, by]]).map(p => p.join(',')).join(' ');
  return `<polyline points="${line}" fill="none" stroke="${col}" stroke-width="${w}"${o.dash ? ' stroke-dasharray="8,6"' : ''} opacity="${op}"/>` +
    `<polygon points="${x2},${y2} ${bx + px},${by + py} ${bx - px},${by - py}" fill="${col}" opacity="${op}"/>`;
}
function along(pts, f) {
  const seg = []; let tot = 0;
  for (let k = 1; k < pts.length; k++) { const l = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]); seg.push(l); tot += l; }
  let d = clamp(f) * tot;
  for (let k = 0; k < seg.length; k++) {
    if (d <= seg[k] || k === seg.length - 1) { const g = seg[k] ? d / seg[k] : 0;
      return [lerp(pts[k][0], pts[k + 1][0], g), lerp(pts[k][1], pts[k + 1][1], g)]; }
    d -= seg[k];
  }
}
function token(pts, f, col, op = 1) {
  if (f <= 0 || f >= 1) return '';
  const [x, y] = along(pts, f);
  return `<circle cx="${x}" cy="${y}" r="16" fill="${col}" opacity="${0.18 * op}"/><circle cx="${x}" cy="${y}" r="9" fill="${col}" opacity="${op}"/>`;
}
function badge(x, y, s, kind, anchor = 'start') {
  const K = {live: [C.green, C.greenT, false], design: [C.indigo, C.indigoT, true], road: [C.mute, '#f1f2f5', true],
    ink: [C.mute, '#f1f2f5', false], note: [C.amber, C.amberT, false]}[kind];
  const w = s.length * 9.4 + 26, xx = anchor === 'end' ? x - w : x;
  return R(xx, y, w, 30, {fill: K[1], stroke: K[0], sw: 1.6, dash: K[2], rx: 15}) +
    T(xx + w / 2, y + 21, s, {size: 16, w: 600, col: K[0], anchor: 'middle'});
}
function badges(list, x, y) {     // right-aligned row of badges ending at x
  let out = '', cx = x;
  for (const [s, k] of list.slice().reverse()) { out += badge(cx, y, s, k, 'end'); cx -= s.length * 9.4 + 26 + 10; }
  return out;
}
function lines(x, y, arr, o = {}) { return arr.map((s, k) => T(x, y + k * (o.lh || 28), s, o)).join(''); }
function wrap(s, n) {
  const out = []; let cur = '';
  for (const w of s.split(' ')) { if ((cur + ' ' + w).trim().length > n) { out.push(cur.trim()); cur = w; } else cur += ' ' + w; }
  if (cur.trim()) out.push(cur.trim()); return out;
}

// ------------------------------------------------------------------ the vault model (credit facility spec, MON loop)
function model(p = 0, top = 0, src = 'cf', f = F.funding90_pct) {
  const L = F.loop_leverage, m = F.margin_per_equity;
  const E = src === 'cf' ? D : D / (1 + m);                 // equity in the loop; own margin keeps a third aside
  const coll = L * E * (1 + p), debt = (L - 1) * E * (1 + p), notional = E * (1 + p), pnl = -E * p;
  const margin = m * E + top * E, loan = (src === 'cf' ? m * E : 0) + top * E;
  const acct = margin + pnl, ratio = acct / notional, equity = coll - debt + acct - loan;
  const lg = F.legs_pct, k = src === 'cf' ? 1 : 1 / (1 + m);
  const rows = [['Staking', lg.stake * k], ['Loop, less the WMON borrow', lg.loop * k],
    ['Funding paid to the short', f * k], ['Swaps and Perpl taker fees', lg.costs * k]];
  if (src === 'cf') rows.push(['Credit facility interest', lg.credit_facility]);
  const net = rows.reduce((a, r) => a + r[1], 0);
  return {E, coll, debt, notional, pnl, margin, loan, acct, ratio, equity, rows, net, src, p};
}

// ------------------------------------------------------------------ the shared diagram
const G = {
  dep: [50, 380, 190, 96], vault: [320, 360, 240, 136], fl: [320, 140, 240, 100],
  mor: [660, 116, 410, 240], per: [660, 492, 410, 262], cf: [50, 600, 300, 140],
  c_dep: [[240, 428], [320, 428]], c_stake: [[440, 360], [440, 240]], c_post: [[560, 190], [660, 190]],
  c_borrow: [[660, 318], [610, 318], [610, 420], [560, 420]], c_margin: [[350, 690], [660, 690]],
  c_short: [[500, 496], [500, 600], [660, 600]], c_repay: [[360, 496], [360, 560], [200, 560], [200, 600]],
};
function box(r, title, ls, col, tint, o = {}) {
  const [x, y, w, h] = r;
  return `<g opacity="${o.op ?? 1}">` + R(x, y, w, h, {fill: tint, stroke: col, sw: o.emph ? 4 : 2, dash: o.dash}) +
    T(x + 18, y + 34, title, {size: 21, w: 700, col}) + lines(x + 18, y + 66, ls, {size: 18, lh: 26, col: C.ink}) + '</g>';
}
const SL = F.short_label || (F.short_leverage + 'x');           // the short's leverage, as shown
const GMAX = Math.max(0.6, 1.2 * F.margin_per_equity);           // the margin gauge's full scale
function gauge(x, y, w, ratio) {
  const s = v => x + clamp(v / GMAX) * w;
  const fillCol = ratio <= F.mmf ? C.red : ratio <= 3 * F.mmf + 0.004 ? C.amber : C.indigo;
  return R(x, y, w, 22, {fill: '#f1f2f5', stroke: C.line, sw: 1, rx: 4}) +
    R(x, y, Math.max(0, s(ratio) - x), 22, {fill: fillCol, rx: 4}) +
    `<line x1="${s(F.mmf)}" y1="${y - 6}" x2="${s(F.mmf)}" y2="${y + 28}" stroke="${C.red}" stroke-width="2.5"/>` +
    `<line x1="${s(3 * F.mmf)}" y1="${y - 6}" x2="${s(3 * F.mmf)}" y2="${y + 28}" stroke="${C.amber}" stroke-width="2.5"/>` +
    `<line x1="${s(F.margin_per_equity)}" y1="${y - 6}" x2="${s(F.margin_per_equity)}" y2="${y + 28}" stroke="${C.mute}" stroke-width="1.5" stroke-dasharray="4,3"/>` +
    T(s(F.mmf), y + 48, 'liquidation', {size: 14, col: C.red, anchor: 'middle'}) +
    T(s(3 * F.mmf) + 6, y + 48, 'top-up', {size: 14, col: C.amber}) + T(s(F.margin_per_equity), y + 48, SL, {size: 14, col: C.mute, anchor: 'middle'});
}
function diagram(o) {
  const v = Object.assign({dep: 1, vault: 1, fl: 1, mor: 1, per: 1, cf: 1, coll: 1, debt: 1, short: 1, frame: 1}, o.vis || {});
  const M = o.M, e = o.emph || {};
  let s = '';
  if (v.frame) s += `<g opacity="${v.frame}">` + R(22, 96, 1070, 680, {fill: 'none', stroke: C.grey, sw: 2, dash: true, rx: 12}) +
    T(40, 124, 'all on Monad: one chain, one shared state', {size: 17, col: C.mute}) + '</g>';
  const cv = M.coll * v.coll, dv = M.debt * v.debt;
  // connectors with labels
  const con = (pts, lab, lx, ly, vis, col, anchor = 'start', dash = false) => vis > 0 ?
    `<g opacity="${vis}">${arrow(pts, {col, dash})}${T(lx, ly, lab, {size: 16, col, anchor})}</g>` : '';
  s += con(G.c_dep, 'deposit', 280, 416, v.vault * v.dep, C.ink, 'middle');
  s += con(G.c_stake, 'stake', 452, 306, v.fl, C.lime);
  s += con(G.c_post, 'post shMON', 610, 178, v.mor, C.green, 'middle');
  s += con(G.c_borrow, 'borrow', 620, 372, v.debt > 0 ? v.mor : 0, C.green);
  s += con(G.c_margin, 'AUSD margin', 505, 678, v.cf * (M.src === 'cf' ? 1 : 0), C.teal, 'middle', true);
  s += con(G.c_short, 'open short', 512, 560, v.per, C.indigo);
  s += box(G.dep, 'Depositor', [usd(D)], C.ink, '#fff', {op: v.dep});
  s += box(G.vault, 'Vault contract', [M.hand || 'owns both legs', 'equity ' + usd(M.equity)], C.ink, '#fff', {op: v.vault, emph: e.vault});
  s += box(G.fl, 'FastLane', ['stakes MON as shMON', pct(F.stake_pct) + ' a year'], C.lime, C.limeT, {op: v.fl});
  if (M.src === 'cf') s += box(G.cf, 'Perpl credit facility', ['in design', 'lends ' + usd(M.loan) + ' AUSD', 'at ' + pct(F.credit_facility_pct, 0) + ' a year'],
    C.teal, C.tealT, {op: v.cf, dash: true});
  else s += box(G.cf, 'Margin', ['from the depositor’s', 'own capital: ' + usd(M.margin)], C.mute, '#fafafa', {op: v.cf});
  // Morpho frame
  const [mx, my, mw, mh] = G.mor;
  s += `<g opacity="${v.mor}">` + R(mx, my, mw, mh, {fill: C.greenT, stroke: C.green, sw: e.mor ? 4.5 : 2}) +
    T(mx + 18, my + 34, 'Morpho · shMON / WMON market', {size: 21, w: 700, col: C.green}) +
    T(mx + 18, my + 74, 'shMON collateral', {size: 18}) + T(mx + mw - 18, my + 74, usd(cv), {size: 20, w: 700, anchor: 'end'}) +
    R(mx + 18, my + 86, (mw - 36) * clamp(cv / (3.9 * D)), 14, {fill: C.green, rx: 3}) +
    T(mx + 18, my + 132, 'WMON borrowed', {size: 18}) + T(mx + mw - 18, my + 132, usd(dv), {size: 20, w: 700, anchor: 'end'}) +
    R(mx + 18, my + 144, (mw - 36) * clamp(dv / (3.9 * D)), 14, {fill: C.amber, rx: 3}) +
    T(mx + 18, my + 196, `LTV ${pct(cv > 0 ? 100 * dv / cv : 0)} · liquidates at ${pct(100 * F.lltv)}`, {size: 18, col: C.green, w: e.mor ? 700 : 400}) +
    T(mx + 18, my + 222, 'oracle: shMON’s exchange rate', {size: 15, col: C.mute}) + '</g>';
  // Perpl frame
  const [px, py, pw, ph] = G.per;
  s += `<g opacity="${v.per}">` + R(px, py, pw, ph, {fill: C.indigoT, stroke: C.indigo, sw: e.per ? 4.5 : 2}) +
    T(px + 18, py + 34, 'Perpl · short MON at ' + SL, {size: 21, w: 700, col: C.indigoD}) +
    T(px + 18, py + 74, 'notional', {size: 18}) + T(px + pw - 18, py + 74, usd(M.notional * v.short), {size: 20, w: 700, anchor: 'end'}) +
    T(px + 18, py + 106, 'profit and loss', {size: 18}) + T(px + pw - 18, py + 106, sgnusd(M.pnl * v.short), {size: 20, w: 700, anchor: 'end', col: M.pnl < -1 ? C.red : M.pnl > 1 ? C.green : C.ink}) +
    T(px + 18, py + 138, 'margin (AUSD)', {size: 18}) + T(px + pw - 18, py + 138, usd(M.margin * v.short), {size: 20, w: 700, anchor: 'end'}) +
    T(px + 18, py + 172, 'margin as a share of notional', {size: 15, col: C.mute}) +
    gauge(px + 18, py + 184, pw - 40, v.short > 0.5 ? M.ratio : F.margin_per_equity) + '</g>';
  return s;
}
function balance(x, y, M, title, show = 1) {
  const vn = typeof VEN !== 'undefined' ? VEN.name : 'Morpho';
  const rows = [['shMON on ' + vn, M.coll, C.green], ['WMON owed to ' + vn, -M.debt, C.amber],
    ['Margin on Perpl', M.margin, C.indigo], ['Short profit and loss', M.pnl, C.indigo]];
  if (M.loan > 0.5) rows.push(['Owed on the credit line', -M.loan, C.teal]);
  if (M.showCash) rows.push(['Held by the vault, in transit', Math.abs(M.cash) < 1 ? 0 : M.cash, C.ink]);
  let s = T(x, y, title, {size: 22, w: 700});
  rows.forEach((r, k) => {
    const op = clamp(show * rows.length - k);
    s += `<g opacity="${op}">` + T(x, y + 46 + k * 40, r[0], {size: 18, col: r[2]}) +
      T(x + 450, y + 46 + k * 40, sgnusd(r[1]), {size: 20, w: 600, anchor: 'end'}) + '</g>';
  });
  const yy = y + 46 + rows.length * 40;
  s += `<g opacity="${clamp(show * rows.length - rows.length + 1)}">` +
    `<line x1="${x}" y1="${yy - 22}" x2="${x + 450}" y2="${yy - 22}" stroke="${C.ink}" stroke-width="1.5"/>` +
    T(x, yy + 8, 'Equity', {size: 22, w: 700}) + T(x + 450, yy + 8, usd(M.equity), {size: 24, w: 700, anchor: 'end'}) + '</g>';
  return s;
}

// ------------------------------------------------------------------ scenes
const P0 = (u, cut) => model(0);

function sGap(u) {
  let s = T(60, 170, 'Onchain yield today', {size: 28, w: 700});
  [['Staking', 0.3], ['Lending', 1.0], ['Looping', 1.7]].forEach(([n, a], k) => {
    const op = win(u, a, 0.6);
    s += `<g opacity="${op}">` + R(60, 200 + k * 92, 400, 72, {fill: C.greenT, stroke: C.green}) +
      T(84, 245 + k * 92, n, {size: 26, w: 600, col: C.green}) + '</g>';
  });
  const g = win(u, 2.6, 0.6);
  s += `<g opacity="${g}">` + R(60, 476, 400, 72, {fill: C.indigoT, stroke: C.indigo, dash: true}) +
    T(84, 512, '+ Funding?', {size: 26, w: 600, col: C.indigo}) + T(84, 538, 'needs a hedge', {size: 17, col: C.indigo}) + '</g>';
  const h = win(u, 3.0, 0.6);
  s += `<g opacity="${h}">` + T(640, 170, 'To hedge it, a vault leaves the chain', {size: 28, w: 700}) +

function shockPath(u) {
  if (u < 1) return 0; if (u < 3) return lerp(0, -0.2, ease((u - 1) / 2)); if (u < 4) return -0.2;
  if (u < 7) return lerp(-0.2, F.rally_to_topup, ease((u - 4) / 3)); return F.rally_to_topup;
}
const rev = pts => pts.slice().reverse();
function tokenL(pts, f, col, label) {               // a moving token, its route as an arrow, its amount beside it
  const route = clamp((f + 0.25) / 0.25) * clamp((1.35 - f) / 0.35);
  if (route <= 0) return '';
  let out = arrow(pts, {col, w: 4, op: route});
  if (f <= 0 || f >= 1) return out;
  const [x, y] = along(pts, f);
  const w = label.length * 9.2 + 18;
  return out + token(pts, f, col) + R(x + 14, y - 34, w, 26, {fill: '#fff', stroke: col, sw: 1.5, rx: 13}) +
    T(x + 14 + w / 2, y - 16, label, {size: 15, w: 700, col, anchor: 'middle'});
}
// The rebalance after the rally to the top-up point, every leg as an actual transfer. With p the rise, E the equity
// and m the short's margin per unit of notional: the credit facility tops up T = (1 + m)pE; then, in one transaction,
// a flash loan repays 2pE of WMON, 3pE of shMON is withdrawn and sold (repaying the flash loan, leaving pE), pE of the
// short is closed (releasing m·pE of AUSD), and the top-up is repaid. The vault ends in its opening shape at the new
// price: 3x loop, the same short leverage, equity E.
const SHOCK = {top: 7.2, r1: 9.0, r2: 11.0, r3: 13.0, r4: 15.0, r5: 17.0, done: 18.8};
function sShock(u, cut) {
  const mm = F.margin_per_equity, p = shockPath(u), E = D, pE = F.rally_to_topup * E, T_ = (1 + mm) * pE;
  const topF = win(u, SHOCK.top, 1.6);
  const pre = model(p, (1 + mm) * F.rally_to_topup * topF);
  const r = k => win(u, SHOCK['r' + k] + (k === 3 || k === 4 ? 1.0 : 0), 1.4);   // the step's amounts land with its last transfer
  const M = Object.assign({}, pre);
  if (u >= SHOCK.r1) {
    M.debt = lerp(pre.debt, 2 * E, r(1));
    M.coll = lerp(pre.coll, 3 * E, r(2));
    const keep = E / pre.notional;                  // share of the short kept; margin and loss are released pro rata
    M.notional = lerp(pre.notional, E, r(4)); M.pnl = lerp(pre.pnl, pre.pnl * keep, r(4)); M.margin = lerp(pre.margin, pre.margin * keep, r(4));
    M.loan = lerp(pre.loan, mm * E, r(5));
    M.acct = M.margin + M.pnl; M.ratio = M.acct / M.notional; M.equity = E;
  }
  M.showCash = true; M.cash = E - (M.coll - M.debt + M.margin + M.pnl - M.loan);   // held mid-transaction, net of the flash loan
  const hand = u >= SHOCK.r5 + 1.4 ? null : u >= SHOCK.r4 + 2.4 ? 'holds ' + usd(T_) + ' AUSD' :
    u >= SHOCK.r3 + 2.4 ? 'holds ' + usd(pE) + ' AUSD' : u >= SHOCK.r2 + 1.4 ? 'holds ' + usd(3 * pE) + ' shMON' :
    u >= SHOCK.r1 + 1.4 ? 'owes a flash loan' : null;
  M.hand = hand;
  const side = Math.max(win(u, SHOCK.r1 - 0.3, .3), 0);
  let s = diagram({M, vis: {dep: 1 - side}, emph: {per: cut !== 'lending', mor: cut === 'lending'}});
  // the transfers
  s += tokenL(G.c_margin, (u - SHOCK.top) / 1.6, C.teal, 'top-up ' + usd(T_) + ' AUSD');
  s += tokenL(rev(G.c_borrow), (u - SHOCK.r1) / 1.4, C.amber, 'repay ' + usd(2 * pE) + ' WMON');
  s += tokenL(G.c_borrow, (u - SHOCK.r2) / 1.4, C.green, usd(3 * pE) + ' shMON');
  s += tokenL(G.c_stake, (u - SHOCK.r3) / 0.95, C.green, 'sell ' + usd(3 * pE) + ' shMON');
  s += tokenL(rev(G.c_stake), (u - SHOCK.r3 - 1.0) / 0.95, C.lime, 'keep ' + usd(pE) + ' after the flash loan');
  s += tokenL(G.c_short, (u - SHOCK.r4) / 0.95, C.indigo, 'close ' + usd(pE) + ' of the short');
  s += tokenL(rev(G.c_short), (u - SHOCK.r4 - 1.0) / 0.95, C.indigo, usd(mm * pE) + ' AUSD released');
  s += tokenL(G.c_repay, (u - SHOCK.r5) / 1.4, C.teal, 'repay ' + usd(T_) + ' AUSD');
  // right panel
  s += T(1130, 150, 'MON price', {size: 20, col: C.mute}) +
    T(1130, 204, spct(100 * p, 0), {size: 52, w: 800, col: p > 0.001 ? C.green : p < -0.001 ? C.red : C.ink});
  s += balance(1130, 260, M, 'The vault', 1);
  const cx = 1130, cy = 640, cw = 440, ch = 110, dur = SCN.shock.dur;
  s += R(cx, cy - 8, cw, ch + 40, {fill: '#fafafc', stroke: C.line, sw: 1});
  const N = 80, pts1 = [], pts2 = [];
  for (let k = 0; k <= N; k++) { const uu = dur * k / N; if (uu > u) break;
    const pp = shockPath(uu), X = cx + 10 + (cw - 20) * k / N;
    pts1.push([X, cy + ch / 2 - pp * Math.min(160, 0.5 * ch / Math.max(0.2, F.rally_to_topup))]); pts2.push([X, cy + ch / 2]); }
  if (pts1.length > 1) s += `<polyline points="${pts1.map(q => q.join(',')).join(' ')}" fill="none" stroke="${C.mute}" stroke-width="2.5"/>` +
    `<polyline points="${pts2.map(q => q.join(',')).join(' ')}" fill="none" stroke="${C.indigoD}" stroke-width="3.5"/>`;
  s += T(cx + 12, cy + ch + 24, '— holding MON', {size: 15, col: C.mute}) + T(cx + 170, cy + ch + 24, '— vault equity', {size: 15, col: C.indigoD});
  // what is happening, top left
  const tr = win(u, 6.4, .4) * (1 - win(u, SHOCK.r1 - 0.3, .3));
  if (tr > 0) s += `<g opacity="${tr}">` + R(40, 150, 264, 150, {fill: C.amberT, stroke: C.amber, sw: 2}) +
    T(60, 188, 'MON +' + Math.round(100 * F.rally_to_topup) + '%', {size: 22, w: 800, col: C.amber}) +
    lines(60, 222, ['the short’s margin is at', '3x maintenance: the credit', 'facility tops it up'], {size: 17, lh: 25, col: C.amber}) + '</g>';
  const ck = win(u, SHOCK.r1 - 0.3, .3) * (1 - win(u, SHOCK.done, .4));
  if (ck > 0) {
    const steps = [['repay ' + usd(2 * pE) + ' WMON', 'with a flash loan', SHOCK.r1, 1.4], ['withdraw ' + usd(3 * pE), 'of shMON', SHOCK.r2, 1.4],
      ['sell it, repay the flash', 'loan, keep ' + usd(pE), SHOCK.r3, 2.0], ['close ' + usd(pE) + ' of the', 'short: ' + usd(mm * pE) + ' back', SHOCK.r4, 2.0],
      ['repay the ' + usd(T_), 'top-up', SHOCK.r5, 1.4]];
    s += `<g opacity="${ck}">` + R(30, 132, 282, 352, {fill: '#fff', stroke: C.indigo, sw: 2.5}) +
      T(46, 162, 'REBALANCE', {size: 19, w: 800, col: C.indigo}) + T(46, 184, 'one transaction: the flash loan is repaid in it', {size: 13, col: C.indigo});
    steps.forEach(([a, b, at, len], k) => {
      const y = 214 + k * 54, st = u >= at + len ? 2 : u >= at ? 1 : 0;
      const col = st === 2 ? C.green : st === 1 ? C.indigo : C.grey;
      s += `<circle cx="58" cy="${y + 6}" r="11" fill="${st ? col : '#fff'}" stroke="${col}" stroke-width="2"/>` +
        T(58, y + 11, st === 2 ? '✓' : String(k + 1), {size: 13, w: 800, col: st ? '#fff' : col, anchor: 'middle'}) +
        T(78, y + 4, a, {size: 15, w: st === 1 ? 700 : 400, col: st ? C.ink : C.mute}) + T(78, y + 24, b, {size: 15, w: st === 1 ? 700 : 400, col: st ? C.ink : C.mute});
    });
    s += '</g>';
  }
  const dn = win(u, SHOCK.done, .5);
  if (dn > 0) s += `<g opacity="${dn}">` + R(30, 132, 282, 352, {fill: C.greenT, stroke: C.green, sw: 2.5}) +
    T(46, 166, 'Back to the opening shape', {size: 18, w: 800, col: C.green}) +
    lines(46, 198, ['at the new price: a 3x loop,', 'a ' + SL + ' short, the top-up repaid,', 'equity ' + usd(E) + '.'], {size: 16, lh: 24, col: C.ink}) +
    `<line x1="46" y1="290" x2="296" y2="290" stroke="${C.line}"/>` +
    T(46, 318, 'In design: hooks', {size: 16, w: 800, col: C.indigo}) +
    lines(46, 344, ['Perpl warns the vault before', 'the top-up line, so it acts', 'first, with no race.'], {size: 16, lh: 24, col: C.indigo}) + '</g>';
  if (cut === 'lending') {
    const c = win(u, 2, .6);
    s += `<g opacity="${c}">` + R(1130, 574, 450, 48, {fill: C.greenT, stroke: C.green, sw: 1.5}) +
      T(1146, 604, 'Collateral and debt move 3:2 together: LTV stays 66.7%', {size: 16, col: C.green, w: 600}) + '</g>';
  }
  return s;
}

// The loop, lap by lap: post shMON on Morpho, borrow 2/3 of it in WMON, stake it, post again. Converges to 3x.
const LAPS = [1.5, 1.2, 1.0, 0.8, 0.6, 0.45, 0.35, 0.3, 0.25, 0.25];      // seconds per lap; the rest fills at the end
function sLoop(u) {
  const E = D, q = 2 / 3;
  let s = '';
  const MB = [60, 170, 300, 120], FB = [470, 170, 300, 120], VB = [265, 470, 300, 120];
  s += box(MB, 'Morpho', ['holds shMON as collateral', 'lends WMON at 2/3 of it'], C.green, C.greenT);
  s += box(FB, 'FastLane', ['stakes WMON', 'returns shMON'], C.lime, C.limeT);
  s += box(VB, 'Vault', ['starts with ' + usd(E), 'of shMON'], C.ink, '#fff');
  const path = [[265, 530], [210, 530], [210, 290]], path2 = [[360, 230], [470, 230]], path3 = [[620, 290], [620, 530], [565, 530]];
  s += arrow(path, {col: C.green}) + T(198, 420, 'post shMON', {size: 17, col: C.green, anchor: 'end'});
  s += arrow(path2, {col: C.amber}) + T(415, 158, 'borrow WMON', {size: 17, col: C.amber, anchor: 'middle'}) + T(415, 256, '2/3', {size: 17, w: 700, col: C.amber, anchor: 'middle'});
  s += arrow(path3, {col: C.lime}) + T(632, 420, 'stake', {size: 17, col: C.lime});
  // lap timing
  const t0 = 0.6; let acc = t0, lap = -1, f = 0;
  for (let k = 0; k < LAPS.length; k++) { if (u < acc + LAPS[k]) { lap = k; f = (u - acc) / LAPS[k]; break; } acc += LAPS[k]; }
  const done = lap < 0 && u >= acc;                                    // every listed lap has run
  const fill = done ? win(u, acc, 1.2) : 0;                            // the remaining laps, collapsed
  const lapsDone = done ? LAPS.length : Math.max(0, lap);
  const post = k => E * Math.pow(q, k), borrow = k => E * Math.pow(q, k + 1);
  let coll = 0, debt = 0;
  for (let k = 0; k < lapsDone; k++) { coll += post(k); debt += borrow(k); }
  if (lap >= 0) { coll += post(lap) * clamp(f / 0.35); debt += borrow(lap) * clamp((f - 0.35) / 0.3); }
  coll = lerp(coll, 3 * E, fill); debt = lerp(debt, 2 * E, fill);
  if (lap >= 0) {                                                       // one token per lap, shrinking with the amount
    const r = 8 + 10 * Math.sqrt(Math.pow(q, lap)), seg = f < 0.35 ? along(path, f / 0.35) : f < 0.65 ? along(path2, (f - 0.35) / 0.3) : along(path3, (f - 0.65) / 0.35);
    const col = f < 0.35 ? C.green : f < 0.65 ? C.amber : C.lime;
    s += `<circle cx="${seg[0]}" cy="${seg[1]}" r="${r + 7}" fill="${col}" opacity=".18"/><circle cx="${seg[0]}" cy="${seg[1]}" r="${r}" fill="${col}"/>`;
    s += T(60, 680, `Lap ${lap + 1}: post ${usd(post(lap))} of shMON, borrow ${usd(borrow(lap))} of WMON`, {size: 22, w: 700});
  } else if (u > t0) {
    s += T(60, 680, 'Each lap is 2/3 of the last: 1 + 2/3 + 4/9 + … = 3', {size: 22, w: 700});
  }
  // stacked columns
  const base = 690, sc = 470 / (3 * E), cx1 = 860, cx2 = 1100, cw = 170;
  const stack = (x, total, unit, col, tint) => {
    let out = '', y = base, k = 0, left = total;
    while (left > 1 && k < 40) { const seg = Math.min(left, unit(k)), h = seg * sc;
      out += R(x, y - h, cw, h, {fill: k % 2 ? tint : col, stroke: '#fff', sw: 1, rx: 2});
      if (h > 26) out += T(x + cw / 2, y - h / 2 + 7, usd(seg), {size: 16, w: 600, col: k % 2 ? col : '#fff', anchor: 'middle'});
      y -= h; left -= seg; k++; }
    return out;
  };
  s += stack(cx1, coll, post, C.green, C.greenT) + stack(cx2, debt, borrow, C.amber, C.amberT);
  s += `<line x1="${cx1 - 20}" y1="${base}" x2="${cx2 + cw + 20}" y2="${base}" stroke="${C.ink}" stroke-width="1.5"/>`;
  s += T(cx1 + cw / 2, base + 30, 'shMON posted', {size: 18, w: 600, col: C.green, anchor: 'middle'}) +
    T(cx2 + cw / 2, base + 30, 'WMON borrowed', {size: 18, w: 600, col: C.amber, anchor: 'middle'});
  s += T(cx1 + cw / 2, base - coll * sc - 14, usd(coll), {size: 22, w: 800, anchor: 'middle'}) +
    T(cx2 + cw / 2, base - debt * sc - 14, usd(debt), {size: 22, w: 800, anchor: 'middle'});
  s += `<line x1="${cx1 - 20}" y1="${base - 3 * E * sc}" x2="${cx2 + cw + 20}" y2="${base - 3 * E * sc}" stroke="${C.grey}" stroke-dasharray="5,4"/>` +
    T(cx2 + cw + 24, base - 3 * E * sc + 5, '3x', {size: 18, w: 700, col: C.mute});
  s += T(1330, 300, 'Loan-to-value', {size: 18, col: C.mute}) +
    T(1330, 340, pct(coll > 0 ? 100 * debt / coll : 0), {size: 34, w: 800, col: C.green}) +
    T(1330, 372, 'the same on every lap', {size: 16, col: C.mute});
  const fl = win(u, acc + 1.6, .6);
  if (fl > 0) s += `<g opacity="${fl}">` + R(1300, 430, 270, 230, {fill: C.indigoT, stroke: C.indigo, sw: 2.5}) +
    T(1318, 466, 'In one transaction', {size: 20, w: 800, col: C.indigo}) +
    lines(1318, 500, ['a free flash loan does', 'every lap at once: borrow', usd(2 * E) + ' WMON, stake it,', 'post ' + usd(3 * E) + ' shMON,', 'borrow ' + usd(2 * E) + ' to repay'], {size: 17, lh: 28, col: C.indigo}) + '</g>';
  return s;
}

// ------------------------------------------------------------------ playback
const Q = new URLSearchParams(location.search);

const X = {p: 0, f: +F.funding90_pct.toFixed(1), src: 'cf'};
function dur(cut) { return CUTS[cut].reduce((a, id) => a + SCN[id].dur, 0); }
function renderAt(t) {
  const list = CUTS[CUT]; let acc = 0;
  for (let k = 0; k < list.length; k++) { const d = SCN[list[k]].dur;
    if (t < acc + d || k === list.length - 1) { document.getElementById('stage').innerHTML = frame(list[k], Math.min(t - acc, d), k, list.length, CUT); return; }
    acc += d; }
}
window.renderAt = renderAt;
window.setCut = c => { CUT = c; window.CUT_DURATION = dur(c); };
window.CUT_DURATION = dur(CUT);
function renderExplore() { document.getElementById('stage').innerHTML = frame('explore', 0, -1, 1, CUT); }
if (Q.has('record')) { document.body.classList.add('record'); renderAt(+(Q.get('t') || 0)); }
else {
  // Step-through playback: each scene plays once and holds on its last frame until the viewer moves on.
  // Autoplay (off by default) runs the scenes back to back, the way the recordings do.
  const $ = id => document.getElementById(id);
  const sel = $('cut'); sel.value = CUT;

  const scenes = $('scenes'), scrub = $('scrub'), play = $('play'), auto = $('auto');
  const list = () => CUTS[CUT], curDur = () => SCN[list()[sIdx]].dur;
  function go(k, playNow = true) {
    sIdx = Math.max(0, Math.min(list().length - 1, k)); u = 0; held = false; mode = 'story';
    playing = playNow; start = performance.now(); play.textContent = playing ? 'Pause' : 'Play';
  }
  function buildButtons() {
    scenes.innerHTML = '';
    list().forEach((id, k) => { const b = document.createElement('button'); b.textContent = (k + 1) + ' ' + SCN[id].title;
      b.onclick = () => go(k); scenes.appendChild(b); });
  }
  buildButtons();
  sel.onchange = () => { CUT = sel.value; window.CUT_DURATION = dur(CUT); buildButtons(); go(0); };
  const next = () => { if (sIdx < list().length - 1) go(sIdx + 1); else go(0); };

  $('back').onclick = $('ovPrev').onclick = back;
  play.onclick = () => {
    if (mode === 'explore') { go(sIdx); return; }
    if (held) { go(sIdx); return; }                                   // replay a finished scene

  };

  const xp = $('xp'), xf = $('xf'), xm = $('xm');

  const onX = () => { X.p = +xp.value; X.f = +xf.value; X.src = xm.value; mode = 'explore'; playing = false; play.textContent = 'Play';
    $('xpv').textContent = spct(X.p, 0); $('xfv').textContent = pct(X.f, 1); renderExplore(); $('ovNext').classList.remove('pulse'); };
  xp.oninput = xf.oninput = xm.onchange = onX;
